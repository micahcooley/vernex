<!DOCTYPE html>
<html>

<head>
    <title>Vernex Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .msg {
            margin: 10px 0;
            padding: 14px 18px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.5;
        }

        .user {
            background: linear-gradient(135deg, #4a4a6a, #3d3d5c);
            margin-left: auto;
        }

        .assistant {
            background: #1a1a2e;
            border: 1px solid #2d2d44;
        }

        /* Collapsible Thought Section - OPEN by default */
        .thought-container {
            margin-bottom: 10px;
        }

        .thought-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #888;
            font-size: 12px;
            padding: 6px 10px;
            background: #252538;
            border-radius: 6px;
            user-select: none;
        }

        .thought-toggle:hover {
            background: #2d2d44;
        }

        .thought-toggle .arrow {
            transition: transform 0.2s;
        }

        .thought-toggle.open .arrow {
            transform: rotate(90deg);
        }

        .thought-content {
            padding: 10px 12px;
            margin-top: 6px;
            background: #1f1f30;
            border-left: 2px solid #7b2cbf;
            font-size: 13px;
            color: #aaa;
            border-radius: 4px;
            display: block;
            /* Open by default */
        }

        .thought-toggle:not(.open)+.thought-content {
            display: none;
        }

        .thought-time {
            color: #666;
            margin-left: auto;
        }

        #input-area {
            display: flex;
            padding: 15px;
            background: #16213e;
            gap: 10px;
            border-top: 1px solid #2d2d44;
        }

        #prompt {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #252538;
            color: #fff;
            font-size: 15px;
        }

        #prompt:focus {
            outline: 2px solid #7b2cbf;
        }

        #send {
            padding: 14px 28px;
            background: linear-gradient(135deg, #7b2cbf, #9d4edd);
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            min-width: 100px;
        }

        #send:hover {
            opacity: 0.9;
        }

        #send.stop {
            background: linear-gradient(135deg, #dc2626, #ef4444);
        }

        h1 {
            padding: 18px 20px;
            background: #16213e;
            border-bottom: 1px solid #2d2d44;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 span {
            font-size: 14px;
            color: #888;
            font-weight: normal;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #0a0a12;
            padding: 12px;
            border-radius: 6px;
            margin: 8px 0;
            overflow-x: auto;
        }

        code {
            font-family: 'Consolas', monospace;
            font-size: 13px;
        }

        .generating {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>
    <h1>🔮 Vernex <span>• 88 TPS • Local AI</span></h1>
    <div id="chat"></div>
    <div id="input-area">
        <input id="prompt" placeholder="Ask Vernex..." onkeypress="if(event.key==='Enter' && !isGenerating)send()">
        <button id="send" onclick="handleButton()">Send</button>
    </div>
    <script>
        const chat = document.getElementById('chat');
        const promptInput = document.getElementById('prompt');
        const sendBtn = document.getElementById('send');

        let isGenerating = false;
        let abortController = null;

        function handleButton() {
            if (isGenerating) {
                stopGeneration();
            } else {
                send();
            }
        }

        function stopGeneration() {
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            isGenerating = false;
            sendBtn.textContent = 'Send';
            sendBtn.classList.remove('stop');
        }

        function parseThoughts(text) {
            const thoughtRegex = /<thought>([\s\S]*?)<\/thought>/g;
            let thoughts = [];
            let cleanText = text;
            let match;

            while ((match = thoughtRegex.exec(text)) !== null) {
                thoughts.push(match[1].trim());
                cleanText = cleanText.replace(match[0], '');
            }

            return { thoughts, cleanText: cleanText.trim() };
        }

        function formatResponse(text, thinkTime) {
            const { thoughts, cleanText } = parseThoughts(text);
            let html = '';

            // Add collapsible thought section - OPEN by default
            if (thoughts.length > 0) {
                html += `
                    <div class="thought-container">
                        <div class="thought-toggle open" onclick="this.classList.toggle('open')">
                            <span class="arrow">▶</span>
                            <span>Reasoning</span>
                            <span class="thought-time">${thinkTime}s</span>
                        </div>
                        <div class="thought-content">${thoughts.join('<br><br>')}</div>
                    </div>
                `;
            }

            let formatted = cleanText
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/\[EDIT:.*?\]/g, '<span style="color:#7b2cbf">📝 Editing...</span>')
                .replace(/\[WRITE:.*?\]/g, '<span style="color:#4ade80">📄 Creating...</span>')
                .replace(/\[SEARCH:.*?\]/g, '<span style="color:#60a5fa">🔍 Searching...</span>')
                .replace(/\[READ:.*?\]/g, '<span style="color:#fbbf24">📖 Reading...</span>');

            html += `<div>${formatted}</div>`;
            return html;
        }

        async function send() {
            const text = promptInput.value.trim();
            if (!text || isGenerating) return;

            isGenerating = true;
            sendBtn.textContent = 'Stop';
            sendBtn.classList.add('stop');
            abortController = new AbortController();

            chat.innerHTML += `<div class="msg user">${text}</div>`;
            promptInput.value = '';

            const assistantDiv = document.createElement('div');
            assistantDiv.className = 'msg assistant generating';
            assistantDiv.innerHTML = '<em style="color:#888">Thinking...</em>';
            chat.appendChild(assistantDiv);
            chat.scrollTop = chat.scrollHeight;

            const startTime = Date.now();

            try {
                const response = await fetch('http://localhost:8000/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: [{ role: 'user', content: text }], stream: true }),
                    signal: abortController.signal
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    for (const line of chunk.split('\n')) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const json = JSON.parse(line.slice(6));
                                fullText += json.choices?.[0]?.delta?.content || '';
                                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                                assistantDiv.innerHTML = formatResponse(fullText, elapsed);
                            } catch { }
                        }
                    }
                    chat.scrollTop = chat.scrollHeight;
                }

                assistantDiv.classList.remove('generating');
            } catch (e) {
                if (e.name === 'AbortError') {
                    assistantDiv.innerHTML += '<em style="color:#f88"> (Stopped)</em>';
                } else {
                    assistantDiv.innerHTML = `<em style="color:#f88">Error: ${e.message}</em>`;
                }
                assistantDiv.classList.remove('generating');
            }

            isGenerating = false;
            sendBtn.textContent = 'Send';
            sendBtn.classList.remove('stop');
        }
    </script>
</body>

</html>
